<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to palladius.github.io...</title>
  <link rel="canonical" href="https://palladius.github.io/">

  <script>
    (function() {
      var target = "https://palladius.github.io" + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <style>

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #ffd369; font-weight: bold; }
  </style>
</head>
<body>
  <div>
    <h2>🎭 Redirecting to Riccardo's Blog...</h2>
    <p>If you are not redirected automatically, click <a id="redirect-link" href="https://palladius.github.io/">here to go to palladius.github.io</a>.</p>
  </div>
</body>
</html>
