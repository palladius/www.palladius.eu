<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to palladius.github.io...</title>
  <link rel="canonical" href="https://palladius.github.io/">
  <script>
    (function() {
      var path = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      // Bust any stale browser 301 cache on palladius.github.io/<subpath>
      if (path !== "/" && search.indexOf("ghp=") === -1) {
        search += (search ? "&" : "?") + "ghp=1";
      }
      var target = "https://palladius.github.io" + path + search + hash;
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://palladius.github.io/">
  </noscript>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #ffd369; font-weight: bold; }
  </style>
</head>
<body>
  <div>
    <h2>🎭 Redirecting to palladius.github.io...</h2>
    <p>If you are not redirected automatically, click <a id="redirect-link" href="https://palladius.github.io/">here</a>.</p>
    <script>
      var a = document.getElementById("redirect-link");
      if (a) a.href = "https://palladius.github.io" + window.location.pathname + window.location.search + window.location.hash;
    </script>
  </div>
</body>
</html>
